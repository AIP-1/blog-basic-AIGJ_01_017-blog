# 개발: docker compose의 PostgreSQL(pgvector), Redis, Ollama (docker-compose.yml)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/blog
    username: blog
    password: blog
  data:
    redis:
      host: localhost
      port: 6379

app:
  recommend:
    # docker compose의 Ollama (R-02)
    ollama-url: http://localhost:11434
  upload:
    dir: /Users/chosun-nhn54/IdeaProjects/blog/uploads
  domain:
    # /etc/hosts에 127.0.0.1 blog.test (quickstart). 블로그는 http://blog.test:8080/@주소
    platform: blog.test
  auth:
    # 개발용 서명 키. 운영은 JWT_SECRET 환경 변수
    jwt-secret: dev-only-jwt-secret-change-me-0123456789abcdef
    # http://blog.test:8080 에서 쿠키를 받으려면 Secure를 끈다
    cookie-secure: false
