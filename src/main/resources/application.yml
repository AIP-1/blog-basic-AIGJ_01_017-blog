spring:
  application:
    name: blog
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 5m
      key-prefix: "blog:"
  jackson:
    time-zone: Asia/Seoul

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
