spring:
  application:
    name: blog
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 5m
      key-prefix: "blog:"
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 이미지는 파일당 10MB까지 (POST-05). 넘으면 400 IMAGE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  domain:
    # 플랫폼 주소. 블로그 주소는 {address}.{platform}
    platform: blog.com
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 로그인 유지를 고르지 않았을 때, 이 시간 동안 아무 요청이 없으면 로그아웃
    idle-timeout: 30m
    cookie-secure: true
  idempotency:
    ttl: 10m
  recommend:
    # 비슷한 글 추천 임베딩 모델 (R-02). bge-m3 = 1024차원, 한국어 지원
    model: bge-m3
    timeout: 30s
  attempt-limit:
    # 로그인 비밀번호·인증 코드·비밀번호 변경: window 안에 max-failures번 틀리면 마지막으로 틀린 때부터 window 동안 막음 (R-17)
    max-failures: 5
    # 같은 IP는 셋을 합쳐 ip-max-failures번. 여러 사람이 한 IP를 쓰는 경우를 생각해 넉넉히
    ip-max-failures: 20
    window: 15m
  popular:
    # 인기 점수 = 최근 window 동안 조회×view-weight + 공감×like-weight + 댓글×comment-weight (R-12, HOME-02)
    window: 1h
    view-weight: 1
    like-weight: 3
    comment-weight: 5
