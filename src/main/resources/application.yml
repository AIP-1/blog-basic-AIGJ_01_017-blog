spring:
  application:
    name: blog
  profiles:
    default: dev
  datasource:
    hikari:
      data-source-properties:
        # 글자 값을 타입 없이(unknown) 보낸다. varchar로 보내면 PostgreSQL이 citext 칸(이메일·닉네임·태그 등)과
        # text끼리 비교해 대소문자를 가린다(citext = varchar → false). 타입이 없으면 칸의 타입(citext)을 따른다 (스텝 23, R-02)
        stringtype: unspecified
      # pgvector HNSW 인덱스 검색은 기본으로 가까운 40개까지만 후보로 본다. 의미 검색은 가까운 순 100개까지 보고(max-results),
      # 가시성 조건을 같은 쿼리에서 거르므로 후보를 넉넉히 보고(ef_search), 조건에 맞는 글이 모자라면 인덱스를 더 읽는다(iterative_scan).
      # 이름에 점이 있는 설정은 vector 확장이 아직 없을 때(처음 Flyway 전)에도 SET할 수 있다
      connection-init-sql: "SET hnsw.ef_search = 200; SET hnsw.iterative_scan = strict_order"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 5m
      key-prefix: "blog:"
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 이미지는 파일당 10MB까지 (POST-05). 넘으면 400 IMAGE_TOO_LARGE
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

# 헬스체크. 롤링 배포 스크립트가 새 앱을 띄운 뒤 /actuator/health/readiness가 UP인지 보고 다음 앱으로 넘어간다.
# 바깥(nginx)에도 열리는 주소라 health 하나만 열고, 무엇이 왜 DOWN인지(details)는 보이지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
      # /actuator(열린 주소 목록)도 쓸 일이 없어 닫는다
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness(살아 있나), /actuator/health/readiness(요청을 받을 수 있나)
      probes:
        enabled: true
      group:
        # 요청을 받으려면 DB와 Redis(로그인·캐시)가 붙어 있어야 한다. 메일(SMTP)은 넣지 않는다(메일 서버가 잠깐 안 돼도 글은 읽혀야 한다)
        readiness:
          include: readinessState,db,redis
  health:
    # 메일 서버 접속 검사는 끈다. 켜 두면 메일 비밀번호가 없을 때(로그로만 남기는 설정) /actuator/health 전체가 DOWN이 된다
    mail:
      enabled: false

app:
  # 카카오·구글 로그인 앱 키(app.oauth, T099)는 비밀이라 여기에 두지 않는다.
  # 개발: config/application-dev.yml(git 제외, 틀은 .example), 운영: application-prod.yml의 ${KAKAO_CLIENT_ID} 등(GitHub secrets).
  # 값이 없으면 그 제공사 버튼은 "지금은 쓸 수 없습니다"로 돌아온다
  mail:
    # 메일 보내는 방법 (T088). log: 보내지 않고 서버 로그에만, smtp: spring.mail.*로 실제 발송.
    # 개발에서 Mailpit으로 받아 보려면 config/application-dev.yml(git 제외, 틀은 .example)에서 smtp로 바꾼다
    sender: log
    from: "now-log <no-reply@now-log.java21.net>"
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  domain:
    # 플랫폼 주소. 블로그 주소는 {platform}/@{address} (스텝 21)
    platform: blog.com
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 로그인 유지를 고르지 않았을 때, 이 시간 동안 아무 요청이 없으면 로그아웃
    idle-timeout: 30m
    cookie-secure: true
  idempotency:
    ttl: 10m
  recommend:
    # 비슷한 글 추천 임베딩 모델 (R-02). bge-m3 = 1024차원, 한국어 지원
    model: bge-m3
    timeout: 30s
  attempt-limit:
    # 로그인 비밀번호·인증 코드·비밀번호 변경: window 안에 max-failures번 틀리면 마지막으로 틀린 때부터 window 동안 막음 (R-17)
    max-failures: 5
    # 같은 IP는 셋을 합쳐 ip-max-failures번. 여러 사람이 한 IP를 쓰는 경우를 생각해 넉넉히
    ip-max-failures: 20
    window: 15m
  popular:
    # 인기 점수 = 최근 window 동안 조회×view-weight + 공감×like-weight + 댓글×comment-weight (R-12, HOME-02)
    window: 1h
    view-weight: 1
    like-weight: 3
    comment-weight: 5
  search:
    semantic:
      # 의미 검색(OWN-07, R-02). 코사인 유사도가 이보다 낮은 글은 뺀다. bge-m3로 잰 값: 관련 있는 글 0.42~0.58, 관련 없는 글 0.21~0.39
      min-similarity: 0.40
      # 가까운 순으로 이만큼까지만 보고 그 안에서 10개씩 나눈다(DB 연결의 hnsw.ef_search 200보다 작아야 한다)
      max-results: 100
  ranking:
    # 블로그 점수 = 정시 전 blog-window 동안 조회·공감·댓글(가중치는 popular와 같음) + 새 구독자×subscribe-weight (R-13, HOME-04)
    blog-window: 7d
    subscribe-weight: 10
