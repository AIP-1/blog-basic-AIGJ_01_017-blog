spring:
  application:
    name: blog
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
    redis:
      time-to-live: 5m
      key-prefix: "blog:"
  jackson:
    time-zone: Asia/Seoul

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}
  domain:
    # 플랫폼 주소. 블로그 주소는 {address}.{platform}
    platform: blog.com
  auth:
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    cookie-secure: true
  idempotency:
    ttl: 10m
