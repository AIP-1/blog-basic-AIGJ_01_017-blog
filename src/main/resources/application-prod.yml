# 운영(실습 서버): 값은 환경 변수로 받는다. GitHub Actions가 secrets를 꺼내 deploy/deploy.sh로 컨테이너에 넘긴다.
server:
  # 실습 서버 개인 포트 8460~8469의 첫 번호. 학교 nginx(now-log.java21.net)가 이 포트로 넘긴다
  port: ${SERVER_PORT:8460}
  # nginx가 넘긴 X-Forwarded-For·X-Forwarded-Proto를 Tomcat이 읽는다.
  # 그래야 로그인 시도 제한이 nginx 주소가 아니라 실제 접속 IP로 센다(research R-17)
  forward-headers-strategy: native

spring:
  # 메일 발송 SMTP (T088). Gmail: 2단계 인증을 켠 계정의 앱 비밀번호(16자리)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      # 같은 docker 네트워크의 Redis 컨테이너(deploy/deploy.sh)
      host: ${REDIS_HOST:aigj017-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

app:
  recommend:
    # 비슷한 글 추천(OWN-06). deploy.sh가 RECOMMEND_DB_PASSWORD가 있으면 PostgreSQL·Ollama 컨테이너를 띄우고 true로 넘긴다.
    # 없으면 false: 추천 DB 없이 앱만 뜨고, "비슷한 글"은 빈 목록
    enabled: ${APP_RECOMMEND_ENABLED:false}
    datasource:
      url: ${RECOMMEND_DB_URL:}
      username: ${RECOMMEND_DB_USERNAME:}
      password: ${RECOMMEND_DB_PASSWORD:}
    ollama-url: ${OLLAMA_URL:}
  mail:
    # 메일 계정(MAIL_PASSWORD)이 있으면 deploy.sh가 smtp로, 없으면 log(서버 로그에만)로 정한다.
    # Gmail은 보낸 사람이 그 Gmail 주소여야 한다
    sender: ${APP_MAIL_SENDER:log}
    from: "now-log <${MAIL_USERNAME:no-reply@now-log.java21.net}>"
  oauth:
    # 카카오 로그인 (T099). 키가 비어 있으면 카카오 버튼은 "지금은 쓸 수 없습니다"로 돌아온다.
    # 리다이렉트 URI는 제공사 콘솔에 등록한 주소와 같아야 한다
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: http://now-log.java21.net/api/auth/oauth/kakao/callback
  upload:
    dir: ${APP_UPLOAD_DIR}
  domain:
    platform: ${APP_PLATFORM_DOMAIN:now-log.java21.net}
  auth:
    jwt-secret: ${JWT_SECRET}
    # 학교 nginx는 http(80)만 받는다. Secure 쿠키는 http에서 저장되지 않으므로 https가 생기기 전까지 끈다
    cookie-secure: ${APP_COOKIE_SECURE:false}
