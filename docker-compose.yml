# 개발용 PostgreSQL(pgvector, 주 DB), Redis, 임베딩 모델 Ollama, 가짜 메일함 Mailpit. 실행: docker compose up -d
services:
  redis:
    image: redis:7.4
    container_name: blog-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 주 DB. 글 임베딩(비슷한 글·의미 검색)도 여기에 둔다 (R-02, 스텝 23에서 MySQL을 합침)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: blog-postgres
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blog", "-d", "blog"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 임베딩 모델 서버. bge-m3 모델은 이미 받아 둔 docker 볼륨 ollama에 있다(없으면: docker exec blog-ollama ollama pull bge-m3)
  ollama:
    image: ollama/ollama:latest
    container_name: blog-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # 개발용 가짜 메일함 (T088). 서버가 보낸 메일을 실제로 보내지 않고 http://localhost:8025 에 모아 보여 준다
  mailpit:
    image: axllent/mailpit:latest
    container_name: blog-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  ollama:
    external: true
